<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Special Date Invitation</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0a0a0c;
      --card-bg: rgba(22, 22, 26, 0.85);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #f5f6fa;
      --text-muted: #8c8d96;
      --input-bg: #141418;
      --input-border: #2a2b32;
      --chip-bg: #16171d;
      --chip-border: #2c2d36;
      --chip-active-bg: #ffffff;
      --chip-active-text: #000000;
      --btn-bg: #ffffff;
      --btn-text: #000000;
      --btn-hover: #e5e5e5;
      --modal-overlay: rgba(0, 0, 0, 0.75);
    }

    [data-theme="light"] {
      --bg: #f4f5f7;
      --card-bg: rgba(255, 255, 255, 0.95);
      --card-border: rgba(0, 0, 0, 0.08);
      --text-main: #111215;
      --text-muted: #64656f;
      --input-bg: #f9fafb;
      --input-border: #dcdde1;
      --chip-bg: #f1f2f6;
      --chip-border: #e0e1e6;
      --chip-active-bg: #111215;
      --chip-active-text: #ffffff;
      --btn-bg: #111215;
      --btn-text: #ffffff;
      --btn-hover: #2a2b32;
      --modal-overlay: rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Kantumruy Pro', sans-serif;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      position: relative;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 26px;
      padding: 24px 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      position: relative;
      z-index: 1;
    }

    /* Top Action Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .status-pill {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
    }

    .theme-btn {
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--text-main);
      font-size: 14px;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
    }

    /* Intro / Question Screen */
    #introScreen {
      text-align: center;
      padding: 30px 10px 15px;
    }

    .intro-emoji {
      font-size: 60px;
      display: inline-block;
      margin-bottom: 16px;
      animation: float 2.5s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .intro-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .intro-sub {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .intro-actions {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      min-height: 52px;
      position: relative;
    }

    .btn-yes {
      padding: 13px 32px;
      border: none;
      border-radius: 14px;
      background: var(--btn-bg);
      color: var(--btn-text);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
    }

    .btn-no {
      padding: 13px 26px;
      border: 1px solid var(--card-border);
      border-radius: 14px;
      background: transparent;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      position: relative;
    }

    /* Form Container (Hidden initially) */
    #mainFormScreen {
      display: none;
      animation: fadeIn 0.4s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header {
      text-align: center;
      margin-bottom: 22px;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .header p {
      font-size: 13px;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 16px;
      min-width: 0;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 7px;
      color: var(--text-main);
    }

    .input-field {
      width: 100%;
      min-width: 0;
      max-width: 100%;
      padding: 13px 14px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
    }

    .input-field:focus {
      border-color: var(--text-main);
    }

    .time-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      min-width: 0;
    }

    .food-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .food-item input {
      display: none;
    }

    .food-item label {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 10px;
      background: var(--chip-bg);
      border: 1px solid var(--chip-border);
      border-radius: 12px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 0;
      text-align: center;
      user-select: none;
      transition: all 0.2s ease;
    }

    .food-item input:checked + label {
      background: var(--chip-active-bg);
      color: var(--chip-active-text);
      font-weight: 700;
      border-color: var(--chip-active-bg);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
      transform: translateY(-2px);
    }

    .submit-btn {
      width: 100%;
      padding: 15px;
      margin-top: 8px;
      border: none;
      border-radius: 14px;
      background: var(--btn-bg);
      color: var(--btn-text);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Chat Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: var(--modal-overlay);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.active {
      display: flex;
      opacity: 1;
    }

    .chat-card {
      width: 100%;
      max-width: 360px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
    }

    .chat-bubble {
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      padding: 16px;
      border-radius: 18px 18px 4px 18px;
      margin: 16px 0;
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-main);
      text-align: left;
    }

    .chat-icon {
      font-size: 38px;
      margin-bottom: 6px;
    }

    .modal-btn {
      width: 100%;
      padding: 12px;
      background: var(--btn-bg);
      color: var(--btn-text);
      font-size: 14px;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body data-theme="dark">

  <div class="container">
    <div class="top-bar">
      <span class="status-pill">Invitation</span>
      <button type="button" class="theme-btn" id="themeToggle">
        <span id="themeIcon">☀️</span> <span id="themeLabel">Light</span>
      </button>
    </div>

    <!-- ១. ផ្ទាំងខាងមុខ (Intro Question Screen) -->
    <div id="introScreen">
      <div class="intro-emoji">💌</div>
      <h2 class="intro-title">តោះទៅ Date ជាមួយគ្នា?</h2>
      <p class="intro-sub">មានមនុស្សម្នាក់ចង់បបួលទៅញ៉ាំអីឆ្ងាញ់ៗ និងដើរលេងជាមួយគ្នា តើព្រមទៅជាមួយគ្នាទេ? ✨</p>
      
      <div class="intro-actions">
        <button type="button" class="btn-yes" id="btnYes">ព្រមទៅ ❤️</button>
        <button type="button" class="btn-no" id="btnNo">អត់ទេ 😜</button>
      </div>
    </div>

    <!-- ២. ផ្ទាំង Form បំពេញព័ត៌មាន (បង្ហាញពេលចុច "ព្រមទៅ") -->
    <div id="mainFormScreen">
      <div class="header">
        <h1>Special Date</h1>
        <p>រើសកាលវិភាគ និងម្ហូបឆ្ងាញ់ៗជាមួយគ្នា</p>
      </div>

      <form id="dateForm">
        <div class="form-group">
          <label for="partnerName">ឈ្មោះ ឬពាក្យផ្អែមល្ហែម</label>
          <input type="text" id="partnerName" class="input-field" placeholder="ឧ. Babe / My Love" required>
        </div>

        <div class="form-group">
          <label for="date">ថ្ងៃណាត់ជួប</label>
          <input type="date" id="date" class="input-field" required>
        </div>

        <div class="time-grid">
          <div class="form-group">
            <label for="startTime">ម៉ោងចេញ</label>
            <input type="time" id="startTime" class="input-field" required>
          </div>
          <div class="form-group">
            <label for="endTime">ម៉ោងត្រឡប់</label>
            <input type="time" id="endTime" class="input-field" required>
          </div>
        </div>

        <div class="form-group">
          <label>មុខម្ហូប (ជ្រើសរើសបានច្រើន)</label>
          <div class="food-grid">
            <div class="food-item">
              <input type="checkbox" id="f1" name="food" value="បុកល្ហុង">
              <label for="f1">បុកល្ហុង</label>
            </div>
            <div class="food-item">
              <input type="checkbox" id="f2" name="food" value="មីចិន">
              <label for="f2">មីចិន</label>
            </div>
            <div class="food-item">
              <input type="checkbox" id="f3" name="food" value="Buffet KANXIN">
              <label for="f3">Buffet KANXIN</label>
            </div>
            <div class="food-item">
              <input type="checkbox" id="f4" name="food" value="ស៊ុបគ្រឿងក្នុង">
              <label for="f4">ស៊ុបគ្រឿងក្នុង</label>
            </div>
            <div class="food-item">
              <input type="checkbox" id="f5" name="food" value="ប្រហិត">
              <label for="f5">ប្រហិត</label>
            </div>
            <div class="food-item">
              <input type="checkbox" id="f6" name="food" value="តែកាហ្វេ">
              <label for="f6">តែ / កាហ្វេ</label>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="note">ចំណាំបន្ថែម</label>
          <input type="text" id="note" class="input-field" placeholder="ឧ. មើលកុន ឬទៅកន្លែងស្ងប់ស្ងាត់...">
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          បញ្ជូនការណាត់
        </button>
      </form>
    </div>
  </div>

  <!-- Chat Box Pop-up Success Modal -->
  <div class="modal-overlay" id="successModal">
    <div class="chat-card">
      <div class="chat-icon">💌</div>
      <h3 style="font-size: 18px; margin-bottom: 4px;">Sent Successfully!</h3>
      <div class="chat-bubble" id="chatMessage"></div>
      <button type="button" class="modal-btn" id="closeModalBtn">យល់ព្រម</button>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz1KqE7DcTZ3klLo2WwfgR75PNlMfkfPxen2zA8Wr0t7IVgDSt2OTbP25k9loXcAyVR/exec';
    const STORAGE_KEY = 'special-date-invitation-state';

    const savedState = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    const saveState = () => {
      const state = {
        theme: body.getAttribute('data-theme'),
        introAccepted: mainFormScreen.style.display === 'block',
        partnerName: document.getElementById('partnerName').value,
        date: document.getElementById('date').value,
        startTime: document.getElementById('startTime').value,
        endTime: document.getElementById('endTime').value,
        note: document.getElementById('note').value,
        foods: Array.from(document.querySelectorAll('input[name="food"]:checked')).map(input => input.id)
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    };

    // ១. Intro Screen Transitions & Playful "No" Button
    const introScreen = document.getElementById('introScreen');
    const mainFormScreen = document.getElementById('mainFormScreen');
    const btnYes = document.getElementById('btnYes');
    const btnNo = document.getElementById('btnNo');

    btnYes.addEventListener('click', () => {
      introScreen.style.display = 'none';
      mainFormScreen.style.display = 'block';
      saveState();
    });

    // ពេលប៉ះ ឬយក Mouse ដាក់លើប៊ូតុង "អត់ទេ" វានឹងរត់គេច
    const moveNoBtn = () => {
      const x = (Math.random() - 0.5) * 160;
      const y = (Math.random() - 0.5) * 80;
      btnNo.style.transform = `translate(${x}px, ${y}px)`;
    };
    btnNo.addEventListener('mouseenter', moveNoBtn);
    btnNo.addEventListener('touchstart', (e) => {
      e.preventDefault();
      moveNoBtn();
    });

    // ២. Theme Switch Logic
    const themeBtn = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const themeLabel = document.getElementById('themeLabel');
    const body = document.body;

    themeBtn.addEventListener('click', () => {
      const isDark = body.getAttribute('data-theme') === 'dark';
      if (isDark) {
        body.setAttribute('data-theme', 'light');
        themeIcon.innerText = '🌙';
        themeLabel.innerText = 'Dark';
      } else {
        body.setAttribute('data-theme', 'dark');
        themeIcon.innerText = '☀️';
        themeLabel.innerText = 'Light';
      }
      saveState();
    });

    // ៣. Form Submit Logic
    const form = document.getElementById('dateForm');
    const submitBtn = document.getElementById('submitBtn');
    const successModal = document.getElementById('successModal');
    const chatMessage = document.getElementById('chatMessage');
    const closeModalBtn = document.getElementById('closeModalBtn');

    const restoreState = () => {
      if (savedState.theme === 'light') {
        body.setAttribute('data-theme', 'light');
        themeIcon.innerText = '🌙';
        themeLabel.innerText = 'Dark';
      }

      if (savedState.introAccepted) {
        introScreen.style.display = 'none';
        mainFormScreen.style.display = 'block';
      }

      ['partnerName', 'date', 'startTime', 'endTime', 'note'].forEach(id => {
        if (savedState[id]) document.getElementById(id).value = savedState[id];
      });

      (savedState.foods || []).forEach(id => {
        const food = document.getElementById(id);
        if (food) food.checked = true;
      });
    };

    form.addEventListener('input', saveState);
    form.addEventListener('change', saveState);
    restoreState();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.innerText = 'កំពុងបញ្ជូន...';

      const partnerName = document.getElementById('partnerName').value;
      const date = document.getElementById('date').value;
      const startTime = document.getElementById('startTime').value;
      const endTime = document.getElementById('endTime').value;
      const note = document.getElementById('note').value || 'គ្មាន';

      const selectedFoods = Array.from(document.querySelectorAll('input[name="food"]:checked'))
                                 .map(cb => cb.value)
                                 .join(', ') || 'មិនបានរើស';

      const payload = { partnerName, date, startTime, endTime, food: selectedFoods, note };

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        chatMessage.innerHTML = `<strong>${partnerName}</strong>: "បានទទួលការណាត់ជួបរួចរាល់ហើយ! យើងជួបគ្នានៅថ្ងៃ <strong>${date}</strong> ម៉ោង <strong>${startTime}</strong> ដល់ <strong>${endTime}</strong> ញ៉ាំ <strong>${selectedFoods}</strong> ជាមួយគ្នាណា! ❤️"`;
        successModal.classList.add('active');
        saveState();
      } catch (err) {
        alert('មានបញ្ហាក្នុងការផ្ញើ សូមសាកល្បងម្ដងទៀត!');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'បញ្ជូនការណាត់';
      }
    });

    closeModalBtn.addEventListener('click', () => {
      successModal.classList.remove('active');
    });
  </script>
</body>
</html>
